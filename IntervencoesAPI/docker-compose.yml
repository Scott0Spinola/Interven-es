services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  intervencoesapi:
    build:
      context: .
      dockerfile: .dockerfile
    image: intervencoesapi:dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Database=IntervencoesAPI;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - mssql
    volumes:
      - ./Logs:/app/Logs

volumes:
  mssql_data:
